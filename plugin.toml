id = "mrboombastic.atom-material-icons"
name = "Atom Material Icons"
version = "1.2.0"
description = "Atom Material Icons for OpenIDEA, ported from Mallowigi's IntelliJ plugin. Includes file and folder icons with light and dark variants."
authors = ["MrBoombastic", "Elior Boukhobza (Mallowigi)"]
license = "MIT"
change-notes = "1.2.0 — Icons by folder (plugin API 1.8): the 44 Atom Material rules OpenIDEA's icon themes can't express are matched by the plugin, so files in tests, specs, mocks, Redux/NgRx, i18n, config and similar folders get their Atom Material icons, as do Behat, Cordova, IcoMoon, Kitchen CI, Raphael and Renovate files. Can be turned off in the plugin's settings. 1.1.0 — UI icons: 241 of OpenIDEA's built-in tool window, action, file type and symbol icons are replaced with Atom Material ones, with switches to show or hide UI and symbol icons. Fix: icons that set their colour on the root SVG element (e.g. README in light themes, Astro) were invisible. 1.0.1 - Fix: .svelte files now get the Svelte icon (the upstream pattern never matched them). 1.0.0 - Initial release, based on Atom Material Icons 210.0.2. Includes dark variants, folder patterns, open-folder icons and visibility settings."
engines.openidea = "^1.8"
wasm = "dist/plugin.wasm"
activation = ["on-startup-finished", "on-event:files-changed", "on-event:file-opened"]
categories = ["icon-themes"]
icon = "icons/folders/icons.svg"

[[contributes.iconThemes]]
id = "atom-material"
label = "Atom Material Icons"
path = "icons/theme.json"

[capabilities]
required = ["project.read", "events"]

[[contributes.commands]]
id = "refresh-path-icons"
title = "Refresh Icons by Folder"
category = "Atom Material Icons"

[contributes.settings]
title = "Atom Material Icons"

[[contributes.settings.pages]]
id = "general"
title = "Icons by folder"
schema = "settings/general.json"

