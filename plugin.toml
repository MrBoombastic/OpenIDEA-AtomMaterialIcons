id = "mrboombastic.atom-material-icons"
name = "Atom Material Icons"
version = "1.1.0"
description = "Atom Material Icons for OpenIDEA, ported from Mallowigi's IntelliJ plugin. Includes file and folder icons with light and dark variants."
authors = ["MrBoombastic", "Elior Boukhobza (Mallowigi)"]
license = "MIT"
change-notes = "1.1.0 — UI icons: 241 of OpenIDEA's built-in tool window, action, file type and symbol icons are replaced with Atom Material ones, with switches to show or hide UI and symbol icons. Fix: icons that set their colour on the root SVG element (e.g. README in light themes, Astro) were invisible. 1.0.1 - Fix: .svelte files now get the Svelte icon (the upstream pattern never matched them). 1.0.0 - Initial release, based on Atom Material Icons 210.0.2. Includes dark variants, folder patterns, open-folder icons and visibility settings."
engines.openidea = "^1.1"
categories = ["icon-themes"]

[[contributes.iconThemes]]
id = "atom-material"
label = "Atom Material Icons"
path = "icons/theme.json"
