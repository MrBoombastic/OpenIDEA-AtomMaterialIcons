[package]
name = "openidea-plugin-mrboombastic-atom-material-icons"
version = "1.2.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.45" }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "perf", "meta", "nfa-pikevm", "nfa-thompson", "hybrid"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
